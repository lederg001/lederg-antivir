name: Build Windows EXE
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Build Windows x64 executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --uac-admin --paths src --name LEDERG-ANTIVIR app.py
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEDERG-ANTIVIR-Windows-x64
          path: dist/LEDERG-ANTIVIR.exe
      - name: Publish Release v0.3.0
        if: "github.ref == 'refs/heads/main' && github.event.head_commit.message == 'release: publish LEDERG ANTIVIR v0.3.0'"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: main
          name: LEDERG ANTIVIR v0.3.0
          files: dist/LEDERG-ANTIVIR.exe
          generate_release_notes: true
